[project]
name = "mini_claw"
version = "1.2.0"
description = "A smart, soulful Dify tool plugin with skill invocation capability"
requires-python = ">=3.12"
dependencies = [
    "dify_plugin>=0.6.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "W",      # pycodestyle warnings
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "N802",   # function name should be lowercase (legacy _ prefixed utils)
    "N806",   # variable in function should be lowercase
    "SIM108", # use ternary operator (less readable in some cases)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
